# Publie le paquet sur PyPI, sans clé : PyPI fait confiance à ce dépôt (« trusted publisher »).
# Se lance à la main (Actions → Publier sur PyPI → Run workflow) ou à chaque étiquette v*.
name: Publier sur PyPI

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publier:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Construction de la version de renvoi (subagent-mail devient escouade-mail)
        working-directory: depreciation
        run: |
          python -m pip install --upgrade build
          python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: depreciation/dist/
